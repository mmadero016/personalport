<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cursor Test</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      cursor: none; /* hide default cursor */
    }

    .custom-cursor {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: rgba(197, 0, 0, 0.376);
      position: fixed;rgba(187, 29, 29, 0.1)rgba(228, 19, 19, 0.1)
      top: 0;
      left: 0;
      pointer-events: none;
      transform: translate(-50%, -50%); /* center circle on pointer */
      z-index: 9999;
    }
  </style>
</head>
<body>

  <div class="custom-cursor"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const cursor = document.querySelector(".custom-cursor");

      document.addEventListener("mousemove", (e) => {
        cursor.style.top = `${e.clientY}px`;
        cursor.style.left = `${e.clientX}px`;
      });
    });
  </script>
</body>
</html>
